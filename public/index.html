<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Memecoin Rug Checker</title>
<style>body{font-family:system-ui;background:#0e1117;color:#e6e6e6;max-width:760px;margin:auto;padding:24px}input,select,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #333;background:#161b22;color:#eee}input{width:100%;box-sizing:border-box;margin:8px 0}button{background:#6c5ce7;border:0;cursor:pointer}.card{background:#161b22;border-radius:12px;padding:18px;margin-top:18px}.score{font-size:48px;font-weight:700}.v{font-size:22px;font-weight:600}li{margin:6px 0}.muted{color:#888;font-size:13px}</style></head><body>
<h1>🪙 Memecoin Rug Checker</h1><p class=muted>Paste a Solana mint or EVM (Ethereum/Base/BSC) contract address.</p>
<input id=a placeholder="Token address"><select id=c><option value="">EVM chain: auto-detect</option><option>ethereum</option><option>base</option><option>bsc</option></select> <button onclick=go()>Check</button>
<div id=out></div>
<script>
const col=v=>({'Likely Legit':'#2ecc71','Caution':'#f1c40f','High Risk':'#e67e22','Likely Scam':'#e74c3c'})[v];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
async function go(){const o=document.getElementById('out');o.innerHTML='<div class=card>Checking…</div>';
const r=await (await fetch('/api/check?address='+encodeURIComponent(a.value)+'&chain='+c.value)).json();
if(r.error){o.innerHTML='<div class=card>'+esc(r.error)+'</div>';return}
const m=r.market,n=(r.extra&&r.extra.name)||(m&&m.name)||'';
o.innerHTML=`<div class=card><div>${esc(n)} ${m?'('+esc(m.symbol)+')':''} · ${r.chain}</div><div class=score style="color:${col(r.verdict)}">${r.score}/100 risk</div><div class=v style="color:${col(r.verdict)}">${r.verdict}</div>
${m?`<p class=muted>Liquidity $${Math.round(m.liquidityUsd).toLocaleString()} · 24h vol $${Math.round(m.volume24h).toLocaleString()} · Age ${m.ageDays==null?'?':m.ageDays.toFixed(0)+' days'} · <a style="color:#9b8cff" href="${m.url}" target=_blank>DexScreener</a></p>`:''}</div>
<div class=card><h3>🚩 Red flags</h3><ul>${r.flags.map(f=>'<li>'+esc(f)+'</li>').join('')||'<li>None found</li>'}</ul><h3>✅ Good signs</h3><ul>${r.good.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
<p class=muted>Data sources: ${esc(Object.entries(r.sources).map(([k,v])=>k+': '+v).join(' · '))}</p><p class=muted>⚠️ ${esc(r.disclaimer)}</p></div>`}
</script></body></html>
